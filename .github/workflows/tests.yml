name: CPU and workflow contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CPU test dependencies
        run: |
          python -m pip install numpy aiohttp
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Python contracts
        run: PYTHONPATH=.:tests python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript contracts
        run: |
          node --check web/draft.js
          node --check web/logic.mjs
          node --check web/lifecycle.mjs
          node --check web/frontend_guard.mjs
          node --test tests/*.test.mjs
